services:
  konben:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_PATH: /data/konben.db
      # The week board does its date maths in local time. Set TZ to your own
      # zone (in a .env next to this file) so anything server-side agrees with
      # the browser instead of drifting to UTC around midnight.
      TZ: ${TZ:-UTC}
    volumes:
      - konben-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  konben-data:
